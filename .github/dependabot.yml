version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # Let new releases age before proposing them: most hijacked npm versions are pulled within days.
    cooldown: { default-days: 7 }
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }
