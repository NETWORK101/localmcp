name: GitHub Pages

on:
  push:
    branches: [main]
    paths: ['hero-proto/**', '.github/workflows/github-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hero-proto/package-lock.json
      - run: npm ci
        working-directory: hero-proto
      # Project site lives at https://network101.github.io/localmcp/ — until a custom domain is set, assets need that prefix.
      - run: npx vite build
        working-directory: hero-proto
        env:
          VITE_BASE: /localmcp/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hero-proto/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
