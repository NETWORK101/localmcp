name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    # Pinned: ubuntu-latest moved to 26.04, which older Playwright builds refuse to install on.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Verify registry signatures of installed packages
        run: npm audit signatures
      - name: No high or critical advisories in shipped dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
